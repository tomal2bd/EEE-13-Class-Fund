<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EEE-13 Class Fund</title>
<style>
  body { font-family: Arial, sans-serif; background: #ecfdf5; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .card { background: #fff; padding: 32px; border-radius: 12px; width: 100%; max-width: 360px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
  h1 { color: #047857; margin: 0 0 4px; font-size: 24px; }
  .sub { color: #6b7280; margin: 0 0 24px; font-size: 14px; }
  input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
  button { width: 100%; padding: 10px; background: #059669; color: #fff; border: 0; border-radius: 8px; font-size: 15px; cursor: pointer; }
  button:hover { background: #047857; }
  #message { margin-top: 12px; font-size: 14px; color: #b91c1c; }
</style>
</head>
<body>
<div class="card">
  <h1>EEE-13 Class Fund</h1>
  <p class="sub">Faridpur Engineering College</p>

  <div id="login-box">
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button id="login-btn">Login</button>
  </div>

  <div id="welcome-box" hidden>
    <p id="welcome-text"></p>
    <button id="logout-btn">Logout</button>
  </div>

  <p id="message"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = 'https://odrehouprwotoveklwnq.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_6diM-UcWc9yIE0FMU9mPsA_4cvpG_JB';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const loginBox = document.getElementById('login-box');
  const welcomeBox = document.getElementById('welcome-box');
  const welcomeText = document.getElementById('welcome-text');
  const message = document.getElementById('message');

  async function showProfile(user) {
    const { data, error } = await db
      .from('profiles')
      .select('email, role')
      .eq('id', user.id)
      .single();

    if (error || !data) {
      message.textContent = 'Profile not found: ' + (error ? error.message : 'no data');
      return;
    }
    message.textContent = '';
    welcomeText.textContent = 'Logged in as ' + data.email + ' (role: ' + data.role + ')';
    loginBox.hidden = true;
    welcomeBox.hidden = false;
  }

  document.getElementById('login-btn').addEventListener('click', async () => {
    message.textContent = '';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const { data, error } = await db.auth.signInWithPassword({ email, password });
    if (error) { message.textContent = 'Login failed: ' + error.message; return; }
    await showProfile(data.user);
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await db.auth.signOut();
    welcomeBox.hidden = true;
    loginBox.hidden = false;
  });

  db.auth.getSession().then(({ data }) => {
    if (data.session) showProfile(data.session.user);
  });
</script>
</body>
</html>
